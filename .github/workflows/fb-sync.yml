# Naujienų skiltis atsinaujina pati: kas 3 val. tikrina facebook.com/TSPstatyba,
# radus naują įrašą įdeda jį į svetainę (tools/fb_sync.py), commit'ina ir push'ina,
# o Vercel iškart perdiegia svetainę.
name: Facebook naujienos

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: fb-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # paskutinio sėkmingo FB nuskaitymo laikas: trumpas FB užsidarymas nesiunčia
      # klaidos laiško, laiškas ateina tik jei FB neatsako ilgiau nei 48 val.
      - name: Būsena
        uses: actions/cache/restore@v4
        with:
          path: .fb-state
          key: fb-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fb-state-

      # ffmpeg skriptas įsidiegia pats, tik kai atsiranda naujas video įrašas
      - name: Įrankiai
        run: pip install --quiet --disable-pip-version-check pillow

      - name: Tikrinti Facebook
        run: python3 tools/fb_sync.py

      - name: Išsaugoti būseną
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .fb-state
          key: fb-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Įkelti naują įrašą
        run: |
          if [ -z "$(git status --porcelain -- index.html assets/news.json img video)" ]; then
            echo "Naujų įrašų nėra."
            exit 0
          fi
          git config user.name "evolviainfo-eng"
          git config user.email "272514210+evolviainfo-eng@users.noreply.github.com"
          git add -A -- index.html assets/news.json img video
          git commit -m "Naujienos: naujas Facebook įrašas"
          git push

      # GitHub išjungia suplanuotus workflow po 60 d. be repo veiklos; tai laiko jį įjungtą
      - name: Neleisti išsijungti
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable fb-sync.yml --repo "$GITHUB_REPOSITORY" || true
